apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: exercises
  name: ping-pong-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      volumes:
        - name: shared-log
          persistentVolumeClaim:
            claimName: status-pong-claim
      containers:
        - name: ping-pong
          image: un1k0rn86/ping-pong:2.1
          volumeMounts:
            - name: shared-log
              mountPath: /usr/src/app/files
          env:
            - name: PORT
              value: "3001"

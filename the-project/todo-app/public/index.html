<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Todo App</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 2rem;
      }
      main {
        max-width: 600px;
        margin: 0 auto;
      }
      form {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }
      input {
        flex: 1;
        padding: 0.5rem;
      }
      button {
        padding: 0.5rem 1rem;
      }
      h1 {
        text-align: center;
      }
      h2 {
        text-align: center;
      }
      ul {
        padding-left: 1.25rem;
      }
      img {
        width: 400px;
        max-width: 100%;
        height: auto;
        display: block;
      }
      .error {
        color: red;
        min-height: 1.25rem;
      }
      .image-wrapper {
        display: flex;
        justify-content: center;
        margin: 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Todo App</h1>
      <div class="image-wrapper">
        <img src="/random-image" alt="Random image" />
      </div>

      <form id="todo-form">
        <input
          id="todo-input"
          type="text"
          maxlength="140"
          placeholder="Add a todo..."
        />
        <button type="submit">Send</button>
      </form>

      <div id="error-message" class="error"></div>

      <h2>Todos</h2>

      <ul id="todo-list"></ul>
    </main>

    <script>
      const todoList = document.getElementById("todo-list");
      const todoInput = document.getElementById("todo-input");
      const errorMessage = document.getElementById("error-message");
      const form = document.getElementById("todo-form");

      const renderTodos = (items) => {
        todoList.innerHTML = "";

        items.forEach((todo) => {
          const li = document.createElement("li");
          li.textContent = typeof todo === "string" ? todo : todo.text;
          todoList.appendChild(li);
        });
      };

      const loadTodos = async () => {
        try {
          const res = await fetch("/todos");

          if (!res.ok) {
            throw new Error("Failed to fetch todos");
          }

          const items = await res.json();
          renderTodos(items);
        } catch (err) {
          console.error(err);
          todoList.innerHTML = "<li>Failed to load todos</li>";
        }
      };

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const value = todoInput.value.trim();
        errorMessage.textContent = "";

        if (!value) {
          errorMessage.textContent = "Todo cannot be empty.";
          return;
        }

        if (value.length > 140) {
          errorMessage.textContent = "Todo must be 140 characters or fewer.";
          return;
        }

        try {
          const res = await fetch("/todos", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ text: value }),
          });

          if (!res.ok) {
            throw new Error("Failed to create todo");
          }

          todoInput.value = "";
          await loadTodos();
        } catch (err) {
          console.error(err);
          errorMessage.textContent = "Could not create todo.";
        }
      });

      loadTodos();
    </script>
  </body>
</html>
